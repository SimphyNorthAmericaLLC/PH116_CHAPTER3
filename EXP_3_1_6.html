<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fabry–Perot Interferometer (Microwave)</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; }
  canvas { border: 1px solid #444; background: #fafafa; }
</style>
</head>

<body>

<h2>Microwave Fabry–Perot Interferometer</h2>
<p>Transmission increases at cavity resonance</p>

<canvas id="c" width="900" height="260"></canvas><br>

Mirror separation (in wavelengths):
<input type="range" id="dslider" min="0.5" max="4" step="0.01" value="2">
<span id="dval">2.00</span>
<br><br>
Intracavity amplitude buildup: <strong id="bval">1.58×</strong>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

const lambda = 90;   // pixels per wavelength
const R = 0.6;       // mirror reflectivity
const F = 4*R/((1-R)*(1-R));
let t = 0;

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const dλ = parseFloat(dslider.value);
  document.getElementById("dval").innerText = dλ.toFixed(2);
  const d = dλ * lambda;

  const xL = 250;
  const xR = xL + d;
  const k = 2*Math.PI/lambda;

  // Round-trip phase, transmitted amplitude, and intracavity buildup
  const delta = 4*Math.PI*d/lambda;
  const T = 1/Math.sqrt(1 + F*Math.sin(delta/2)**2);
  const buildup = Math.sqrt(1-R) /
    Math.sqrt((1-R)*(1-R) + 4*R*Math.sin(delta/2)**2);
  document.getElementById("bval").innerText = buildup.toFixed(2) + "×";

  // Draw mirrors
  ctx.fillStyle = "rgba(0,0,255,0.4)";
  ctx.fillRect(xL-4, 20, 8, 220);
  ctx.fillRect(xR-4, 20, 8, 220);

  // Direction arrow: transmitter to receiver
  ctx.strokeStyle = "#c62828";
  ctx.fillStyle = "#c62828";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(150, 72);
  ctx.lineTo(215, 72);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(215, 72);
  ctx.lineTo(205, 66);
  ctx.lineTo(205, 78);
  ctx.closePath();
  ctx.fill();
  ctx.font = "bold 13px Arial";
  ctx.fillText("wave propagation", 145, 60);

  // Draw wave
  ctx.beginPath();
  ctx.strokeStyle = "black";
  ctx.lineWidth = 2;

  for (let x=0; x<canvas.width; x++) {
    let y = 130;

    // Incident wave
    if (x < xL) {
      // sin(kx - wt) propagates toward increasing x: to the right.
      y += 15*Math.sin(k*x - t);
    }

    // Standing wave inside cavity
    else if (x >= xL && x <= xR) {
      const sw =
        Math.sin(k*(x-xL)-t) +
        Math.sin(k*(xR-x)-t);
      // The cavity field is strongest when d = m(lambda/2).
      // Between resonances, phase mismatch reduces the field buildup.
      y += 15*buildup*sw;
    }

    // Transmitted wave (MODULATED!)
    else {
      y += 15*T*Math.sin(k*x - t);
    }

    if (x === 0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }

  ctx.stroke();

  // Basic transmitter and receiver labels
  ctx.font = "bold 14px Arial";
  ctx.textAlign = "center";
  ctx.fillStyle = "#222";
  ctx.fillText("TRANSMITTER", 90, 225);
  ctx.fillText("RECEIVER", 810, 225);
  ctx.font = "13px Arial";
  ctx.fillText("emitted wave", 90, 244);
  ctx.fillText("transmitted wave", 810, 244);
  ctx.fillStyle = "#174ea6";
  ctx.fillText("Reflector 1", xL, 16);
  ctx.fillText("Reflector 2", xR, 16);
  ctx.fillStyle = "#222";
  ctx.fillText("Fabry–Perot cavity", (xL+xR)/2, 42);
  ctx.textAlign = "start";
}

function animate() {
  t += 0.05;
  draw();
  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
