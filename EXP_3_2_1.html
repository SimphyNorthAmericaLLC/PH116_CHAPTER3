<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Two-Wave Superposition — Dispersive vs Non-Dispersive Medium</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg:#0b0d12; --panel:#101522; --grid:#1a2234; --fg:#eaf0f6; --muted:#94a3b8;
    --w1:#5cc8ff; --w2:#ff6b6b; --sum:#ffffff;
    --env:#33f5c7; --envLow:#146b58;
  }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--fg); }
  .wrap { max-width:1120px; margin:18px auto; padding:0 14px; }
  h1 { font-size:1.25rem; margin:0 0 10px; font-weight:700; }
  .card { background:var(--panel); border:1px solid #1f2a44; border-radius:14px; padding:12px 14px; box-shadow:0 2px 14px rgba(0,0,0,.25); }
  .controls { display:grid; gap:12px; grid-template-columns: repeat(auto-fit, minmax(245px,1fr)); }
  label { display:block; font-size:.9rem; color:var(--muted); margin-bottom:6px; }
  input[type=number], select, button { width:100%; background:#0f1320; color:var(--fg); border:1px solid #22304e; border-radius:10px; padding:8px 10px; box-sizing:border-box; }
  .legend { display:flex; gap:16px; font-size:.9rem; color:var(--muted); margin-bottom:8px; flex-wrap:wrap; }
  .dot { width:12px; height:12px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:-2px; }
  canvas { width:100%; height:380px; border-radius:14px; display:block; background:#070a12; border:1px solid #1f2a44; }
  .metrics { display:grid; grid-template-columns: repeat(auto-fit, minmax(230px,1fr)); gap:8px; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size:.92rem; }
  .row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .row span { min-width:52px; }
  .btns { display:flex; gap:8px; }
  .muted { color:var(--muted); }
  .note { color:var(--muted); font-size:.85rem; line-height:1.3; margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Two-Wave Superposition — Dispersive vs Non-Dispersive Medium</h1>

  <div class="card" style="margin-bottom:12px">
    <div class="legend">
      <div><span class="dot" style="background:var(--w1)"></span>Wave 1</div>
      <div><span class="dot" style="background:var(--w2)"></span>Wave 2</div>
      <div><span class="dot" style="background:var(--sum)"></span>Sum</div>
      <div><span class="dot" style="background:var(--env)"></span>Envelope (±)</div>
    </div>
    <canvas id="cv" width="1040" height="380"></canvas>
  </div>

  <div class="controls">
    <div class="card">
      <label>Medium / dispersion relation</label>
      <select id="model">
        <option value="nondisp" selected>Non-dispersive: c₁ = c₂</option>
        <option value="separate">Independent phase speeds: c₁ and c₂</option>
        <option value="disp">Dispersive: ωᵢ = cᵢ·kᵢ + β·kᵢ³</option>
        <option value="custom">Custom: enter ω₁ and ω₂ manually</option>
      </select>
      <div class="row"><span class="muted">c₁</span><input id="c1" type="number" step="0.1" value="3.0"></div>
      <div class="row"><span class="muted">c₂</span><input id="c2" type="number" step="0.1" value="3.0"></div>
      <div class="row"><span class="muted">β</span><input id="beta" type="number" step="0.01" value="0.30"></div>
      <div class="row"><span class="muted">Δt</span><input id="dt" type="number" step="0.005" value="0.010"></div>
      <div class="btns">
        <button id="toggle">⏸︎ Pause</button>
        <button id="reset">↺ Reset</button>
      </div>
      <div class="note">Default is non-dispersive: c₁ = c₂. Use independent-speed mode only when you want students to compare two different phase speeds.</div>
    </div>

    <div class="card">
      <label>Wave 1</label>
      <div class="row"><span class="muted">A₁</span><input id="A1" type="number" step="0.1" value="1.0"></div>
      <div class="row"><span class="muted">k₁</span><input id="k1" type="number" step="0.05" value="2.00"></div>
      <div class="row"><span class="muted">ω₁</span><input id="w1" type="number" step="0.05" value="6.00"></div>
      <div class="row"><span class="muted">Dir</span>
        <select id="dir1">
          <option value="right" selected>Right (cos(kx − ωt))</option>
          <option value="left">Left (cos(kx + ωt))</option>
        </select>
      </div>
    </div>

    <div class="card">
      <label>Wave 2</label>
      <div class="row"><span class="muted">A₂</span><input id="A2" type="number" step="0.1" value="1.0"></div>
      <div class="row"><span class="muted">k₂</span><input id="k2" type="number" step="0.05" value="2.50"></div>
      <div class="row"><span class="muted">ω₂</span><input id="w2" type="number" step="0.05" value="7.50"></div>
      <div class="row"><span class="muted">Dir</span>
        <select id="dir2">
          <option value="right" selected>Right (cos(kx − ωt))</option>
          <option value="left">Left (cos(kx + ωt))</option>
        </select>
      </div>
    </div>

    <div class="card metrics" id="metrics"></div>
  </div>
</div>

<script>
(function(){
  const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  const E=id=>document.getElementById(id);
  const model=E('model'), c1El=E('c1'), c2El=E('c2'), betaEl=E('beta'), dtEl=E('dt');
  const A1=E('A1'), k1=E('k1'), w1=E('w1'), dir1=E('dir1');
  const A2=E('A2'), k2=E('k2'), w2=E('w2'), dir2=E('dir2');
  const toggle=E('toggle'), reset=E('reset'), metrics=E('metrics');
  let t=0, running=true;
  const XMIN=-12, XMAX=12, YMIN=-2.8, YMAX=2.8;

  function x2px(x){return (x-XMIN)*(cv.width/(XMAX-XMIN));}
  function y2py(y){return (YMAX-y)*(cv.height/(YMAX-YMIN));}
  function val(n){return parseFloat(n.value);}
  function omegaChoice(k, which){
    const c1=val(c1El), c2=val(c2El), b=val(betaEl);
    if(model.value==='nondisp'){
      c2El.value=c1.toFixed(3);
      return c1*k;
    }
    if(model.value==='separate') return (which===1 ? c1 : c2)*k;
    if(model.value==='disp') return (which===1 ? c1 : c2)*k+b*k*k*k;
    return null;
  }
  function localGroupSpeed(k){
    const c1=val(c1El), c2=val(c2El), b=val(betaEl);
    if(model.value==='nondisp') return c1;
    if(model.value==='disp') return ((c1+c2)/2)+3*b*k*k;
    return NaN;
  }
  function fmt(x){ return Number.isFinite(x) ? x.toFixed(3) : '—'; }


  function updateInputState(){
    const m=model.value;
    c1El.disabled = false;
    c2El.disabled = (m==='nondisp');
    betaEl.disabled = !(m==='disp');
    w1.disabled = !(m==='custom');
    w2.disabled = !(m==='custom');
  }

  function drawAxes(){
    ctx.fillStyle='#070a12'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.strokeStyle='#1a2234'; ctx.lineWidth=1;
    const y0=y2py(0);
    ctx.beginPath(); ctx.moveTo(0,y0); ctx.lineTo(cv.width,y0); ctx.stroke();
    for(let gx=Math.ceil(XMIN); gx<=Math.floor(XMAX); gx++){
      if(gx%2!==0) continue;
      ctx.beginPath(); ctx.moveTo(x2px(gx),0); ctx.lineTo(x2px(gx),cv.height); ctx.stroke();
    }
  }

  function computeParams(){
    updateInputState();
    const K1=val(k1), K2=val(k2);
    let W1=val(w1), W2=val(w2);
    const A_1=val(A1), A_2=val(A2);
    const s1=(dir1.value==='right')?-1:+1;
    const s2=(dir2.value==='right')?-1:+1;
    if(model.value!=='custom'){
      W1=omegaChoice(K1,1); W2=omegaChoice(K2,2);
      w1.value=W1.toFixed(3); w2.value=W2.toFixed(3);
    }
    return {A1:A_1,A2:A_2,K1,K2,W1,W2,s1,s2};
  }

  function drawCurve(color, width, fn){
    ctx.strokeStyle=color; ctx.lineWidth=width; ctx.beginPath(); let first=true;
    for(let px=0;px<cv.width;px++){
      const x=XMIN+(px/cv.width)*(XMAX-XMIN);
      const y=fn(x);
      const py=y2py(y);
      if(first){ctx.moveTo(x2px(x),py);first=false;}else ctx.lineTo(x2px(x),py);
    }
    ctx.stroke();
  }

  function draw(){
    drawAxes();
    const P=computeParams();
    const css=getComputedStyle(document.documentElement);

    drawCurve(css.getPropertyValue('--w1'), 1.5, x => P.A1*Math.cos(P.K1*x+P.s1*P.W1*t));
    drawCurve(css.getPropertyValue('--w2'), 1.5, x => P.A2*Math.cos(P.K2*x+P.s2*P.W2*t));
    drawCurve(css.getPropertyValue('--sum'), 2.0, x => P.A1*Math.cos(P.K1*x+P.s1*P.W1*t)+P.A2*Math.cos(P.K2*x+P.s2*P.W2*t));

    drawCurve(css.getPropertyValue('--env'), 1.5, x => {
      const dphi=(P.K1-P.K2)*x+(P.s1*P.W1-P.s2*P.W2)*t;
      return Math.sqrt(P.A1**2+P.A2**2+2*P.A1*P.A2*Math.cos(dphi));
    });
    drawCurve(css.getPropertyValue('--envLow'), 1.5, x => {
      const dphi=(P.K1-P.K2)*x+(P.s1*P.W1-P.s2*P.W2)*t;
      return -Math.sqrt(P.A1**2+P.A2**2+2*P.A1*P.A2*Math.cos(dphi));
    });

    const vp1=P.K1!==0 ? P.W1/P.K1 : NaN;
    const vp2=P.K2!==0 ? P.W2/P.K2 : NaN;
    const dK=P.K2-P.K1, dW=P.W2-P.W1;
    const envSpeed=Math.abs(dK)>1e-12 ? dW/dK : NaN;
    const kbar=(P.K1+P.K2)/2, wbar=(P.W1+P.W2)/2;
    const carrierSpeed=Math.abs(kbar)>1e-12 ? wbar/kbar : NaN;
    const vgLocal=localGroupSpeed(kbar);
    let modelText = model.value==='disp' ? `ωᵢ = cᵢ·kᵢ + β·kᵢ³` : (model.value==='nondisp' ? `c₁ = c₂` : `custom ω₁, ω₂`);
    if(model.value==='separate') modelText = `independent c₁ and c₂`;

    metrics.innerHTML=`
      <div><b>model</b>: ${modelText}</div>
      <div><b>k₁, ω₁</b>: ${fmt(P.K1)}, ${fmt(P.W1)}</div>
      <div><b>k₂, ω₂</b>: ${fmt(P.K2)}, ${fmt(P.W2)}</div>
      <div><b>vₚ₁ = ω₁/k₁</b>: ${fmt(vp1)}</div>
      <div><b>vₚ₂ = ω₂/k₂</b>: ${fmt(vp2)}</div>
      <div><b>carrier speed</b>: ${fmt(carrierSpeed)}</div>
      <div><b>envelope speed Δω/Δk</b>: ${fmt(envSpeed)}</div>
      <div><b>local v_g at k̄</b>: ${fmt(vgLocal)}</div>
      <div><b>k̄</b>: ${fmt(kbar)}</div>
      <div><b>t</b>: ${fmt(t)}</div>
    `;
  }

  function step(){
    const dt=Math.max(0.001,parseFloat(dtEl.value)||0.01);
    if(running)t+=dt;
    draw();
    updateInputState();
  requestAnimationFrame(step);
  }

  [model,c1El,c2El,betaEl,dtEl,A1,k1,w1,dir1,A2,k2,w2,dir2].forEach(el=>{
    el.addEventListener('input',()=>{ draw(); });
  });

  toggle.addEventListener('click',()=>{running=!running;toggle.textContent=running?'⏸︎ Pause':'▶︎ Play';});
  reset.addEventListener('click',()=>{t=0; draw();});
  updateInputState();
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
